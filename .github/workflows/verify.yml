name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:pages -- okx-chat-swap
      - run: python3 scan_dist.py dist-pages
      - name: Built docs must match the Pages output
        run: |
          # Compare verified docs/ with a fresh CI build, excluding only mtime.
          diff -rq docs dist-pages
